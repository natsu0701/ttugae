<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>뜨개러투게더 — 뜨개질이 더 즐거워지는 순간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#FFFBF7"
        aria-busy="true"
      >
        <img
          src="%BASE_URL%뜨니_챗봇프로필.svg"
          alt=""
          width="64"
          height="64"
          style="border-radius:999px;background:#f5f5f4"
        />
        <div style="display:flex;gap:6px" aria-hidden="true">
          <span style="width:6px;height:6px;border-radius:999px;background:#fc5f53;opacity:.4;animation:boot-dot .9s ease-in-out infinite"></span>
          <span style="width:6px;height:6px;border-radius:999px;background:#fc5f53;opacity:.4;animation:boot-dot .9s ease-in-out .15s infinite"></span>
          <span style="width:6px;height:6px;border-radius:999px;background:#fc5f53;opacity:.4;animation:boot-dot .9s ease-in-out .3s infinite"></span>
        </div>
      </div>
    </div>
    <style>
      @keyframes boot-dot {
        0%, 70%, 100% { transform: translateY(0); opacity: 0.35; }
        35% { transform: translateY(-3px); opacity: 1; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
