<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>뜨개러투게더 앱</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        if (location.pathname.indexOf("/ttugae/") !== 0) return;
        if (location.port === "5173" || location.port === "5174" || location.port === "5175") return;
        navigator.serviceWorker.register("/ttugae/sw.js", { scope: "/ttugae/" }).then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (reg) {
          if (reg.active) reg.active.postMessage("precache");
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
