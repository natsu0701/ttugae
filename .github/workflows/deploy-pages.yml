name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Release stuck GitHub Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          curl -sS -H "$AUTH" -H "$ACCEPT" \
            "$API/deployments?environment=github-pages&per_page=30" \
            | python3 -c "import json,sys; [print(d['id']) for d in json.load(sys.stdin)]" \
            | while read -r id; do
                [ -n "$id" ] || continue
                curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
                  -H "Content-Type: application/json" \
                  "$API/deployments/${id}/statuses" \
                  -d '{"state":"inactive","environment":"github-pages","description":"cleared for Vite dist deploy"}' \
                  >/dev/null || true
              done
      - name: Wait for branch Pages publish to finish
        run: sleep 90
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
